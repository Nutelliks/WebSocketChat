services:
  db:
    image: postgres:17-alpine

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports: 
      - "5433:5432"


  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

  api:

    build: .

    depends_on:
      - db
      - redis

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
